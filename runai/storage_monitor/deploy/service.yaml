# Storage Monitor - Kubernetes Service
#
# Exposes the storage monitor dashboard within the cluster.
# Access via:
#   kubectl port-forward svc/storage-monitor 8081:8081
#   Then open http://localhost:8081

apiVersion: v1
kind: Service
metadata:
  name: storage-monitor
  labels:
    app: storage-monitor
spec:
  type: ClusterIP
  selector:
    app: storage-monitor
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
